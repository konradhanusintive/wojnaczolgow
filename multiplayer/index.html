<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wojna Czołgów 3D - Multiplayer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="intro-screen" class="overlay">
      <img id="intro-logo" src="Logo.png" alt="Logo Gry Wojna Czołgów" />
    </div>

    <div id="start-screen" class="overlay" style="display: none">
      <h1 id="selection-title">Wybierz Swój Czołg</h1>
      <div class="tank-selection-container">
        <!-- Karty czołgów będą generowane dynamicznie przez JavaScript -->
      </div>
       <fieldset id="server-config-panel">
        <div id="terrain-controls">
          <h2 id="terrain-title">Ustawienia Serwera (Tylko Pierwszy Gracz)</h2>
          
          <div id="map-size-selector">
              <h3>Rozmiar Mapy</h3>
              <div class="size-options">
                  <input type="radio" id="size-s" name="map-size" value="S"><label for="size-s">S</label>
                  <input type="radio" id="size-m" name="map-size" value="M" checked><label for="size-m">M</label>
                  <input type="radio" id="size-l" name="map-size" value="L"><label for="size-l">L</label>
                  <input type="radio" id="size-xl" name="map-size" value="XL"><label for="size-xl">XL</label>
                  <input type="radio" id="size-xxl" name="map-size" value="XXL"><label for="size-xxl">XXL</label>
              </div>
          </div>

          <div class="control-row">
              <label for="terrain-amplitude">Wysokość Wzgórz:</label>
              <input type="range" id="terrain-amplitude" min="5" max="200" value="20">
              <span id="amplitude-value">20</span>
          </div>
          <div class="control-row">
              <label for="terrain-scale">Gęstość Wzgórz:</label>
              <input type="range" id="terrain-scale" min="50" max="200" value="120">
              <span id="scale-value">120</span>
          </div>
        </div>
       </fieldset>
    </div>

    <!-- UI Gry -->
    <div id="hud" class="hud" style="display: none;">
      <div class="hud-line"><strong>TWÓJ CZOŁG</strong><span>PUNKTY: <span id="score-value">0</span></span></div>
      <div class="hud-line"><span>HP:</span><span id="hp-value"></span></div>
      <div class="hud-bar"><div id="hp-bar" class="hud-bar-fill"></div></div>
      <div class="hud-line" style="margin-top: 10px;"><span>Apteczki:</span><span id="medkits-value"></span></div>
      <div id="powerup-hud" class="hud-powerup" style="display: none;"></div>
    </div>
    
    <div id="weapon-bar" class="weapon-bar" style="display: none;">
      <!-- Sloty na broń będą generowane dynamicznie przez JS -->
    </div>

    <div id="minimap-container" style="display: none;">
      <canvas id="minimap"></canvas>
    </div>

    <div id="respawn-message" class="respawn-message" style="display: none"></div>
    <div id="speech-bubbles-container"></div>
    <div id="kill-feed-container"></div>

    <div id="menu" class="overlay" style="display: none">
      <h1>PAUZA</h1>
      <p>Naciśnij ESC</p>
    </div>
    <div id="map-overlay" class="overlay" style="display: none">
      <h1>MAPA</h1>
      <canvas id="map-container" width="400" height="400"></canvas>
      <p>Naciśnij M</p>
    </div>
    <div id="score-overlay" class="overlay" style="display: none">
      <h1>WYNIKI</h1>
      <p id="score-display" style="font-size: 1.5em; text-align: left;"></p>
      <p>Przytrzymaj TAB</p>
    </div>
    
    <div id="sniper-overlay">
        <div id="sniper-reticle"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="background.js"></script>
    <script type="module" src="environment.js"></script>
    <script type="module" src="tankModels.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
