<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wojna Czołgów 3D - Edycja Ostateczna</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: white;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        z-index: 50;
      }
      #intro-screen {
        background-color: #000;
        z-index: 100;
      }
      #intro-logo {
        max-width: 500px;
        width: 90%;
        height: auto;
        animation: fadeInOut 4s ease-in-out forwards;
      }
      @keyframes fadeInOut {
        0% {
          opacity: 0;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(0.95);
        }
      }
      #start-screen {
        background: url("https://www.transparenttextures.com/patterns/carbon-fibre.png"),
          rgba(0, 0, 0, 0.9);
      }
      #selection-title {
        font-size: 3em;
        color: #ffc107;
        text-shadow: 2px 2px 4px #000;
        margin-bottom: 20px;
      }
      .tank-selection-container {
        display: flex;
        justify-content: center;
        gap: 30px;
        width: 90%;
        max-width: 1200px;
      }
      .tank-card {
        border: 2px solid #555;
        border-radius: 10px;
        background-color: rgba(20, 20, 20, 0.7);
        padding: 20px;
        width: 300px;
        transition: transform 0.2s, box-shadow 0.2s;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .tank-card:not(.locked):hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 20px rgba(255, 193, 7, 0.3);
        border-color: #ffc107;
      }
      .tank-card.locked {
        opacity: 0.6;
      }
      .tank-canvas {
        width: 100%;
        height: 150px;
        margin-bottom: 15px;
        border-radius: 5px;
        cursor: grab;
      }
      .premium-label {
        position: absolute;
        top: -15px;
        right: -15px;
        background: #ffc107;
        color: #000;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
        transform: rotate(15deg);
      }
      .tank-card h3 {
        color: #ffc107;
        margin-top: 0;
        font-size: 1.5em;
      }
      .stats-container {
        text-align: left;
        margin: 15px 0;
        font-size: 0.9em;
      }
      .stat-line {
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .stat-bar-container {
        width: 60%;
        background: #333;
        border-radius: 5px;
        height: 15px;
        border: 1px solid #777;
      }
      .stat-bar-fill {
        background: linear-gradient(90deg, #dc3545, #ffc107, #28a745);
        height: 100%;
        border-radius: 4px;
      }
      .select-button {
        background: #28a745;
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 1em;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: auto;
      }
      .select-button:hover {
        background: #218838;
      }
      .select-button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      .hud {
        position: absolute;
        bottom: 20px;
        color: white;
        font-family: "Consolas", "Lucida Console", monospace;
        font-size: 1.1em;
        background-color: rgba(0, 0, 0, 0.6);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        min-width: 260px;
        box-sizing: border-box;
        z-index: 10;
      }
      #hud-left {
        left: 20px;
      }
      #hud-right {
        right: 20px;
      }
      .hud-line {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
      }
      .hud-powerup {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #777;
        color: #ffc107;
        font-weight: bold;
      }
      .hud-bar {
        background: #555;
        border-radius: 5px;
        overflow: hidden;
        height: 20px;
        border: 1px solid #888;
      }
      .hud-bar-fill {
        background: #28a745;
        width: 100%;
        height: 100%;
        transition: width 0.5s;
      }
      .hud-bar-fill.low {
        background: #dc3545;
      }
      .message {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: #ffc107;
        font-size: 2em;
        font-family: "Arial Black", sans-serif;
        text-shadow: 2px 2px 4px #000;
        display: none;
        text-align: center;
        z-index: 20;
      }
      #message-display {
        bottom: 150px;
      }
      .respawn-message {
        position: absolute;
        width: 50%;
        top: 40%;
        font-size: 3em;
        color: #ff4500;
        text-shadow: 3px 3px 6px #000;
        animation: pop 1s infinite;
        z-index: 60;
      }
      #respawn-message-1 {
        left: 0;
      }
      #respawn-message-2 {
        right: 0;
      }
      @keyframes pop {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }
      .speech-bubble {
        position: absolute;
        background: rgba(255, 255, 255, 0.9);
        color: #000;
        padding: 10px 15px;
        border-radius: 15px;
        font-family: "Comic Sans MS", cursive, sans-serif;
        font-size: 1em;
        max-width: 200px;
        text-align: center;
        transform: translate(-50%, -120%); /* Center above the point */
        z-index: 30;
        border: 2px solid #333;
      }
      .speech-bubble::after {
        content: "";
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 15px 15px 0;
        border-style: solid;
        border-color: rgba(255, 255, 255, 0.9) transparent transparent
          transparent;
      }
    </style>
  </head>

    <script type="module">

      const TANKS_DATA = {

      const TANK_QUOTES = [

      const gameState = {

          {

      const CONTROLS = [
        {

          back: "KeyS",
          left: "KeyA",
          right: "KeyD",
          tLeft: "KeyQ",
          tRight: "KeyE",
          tUp: "KeyF",

          fire: "Space",

        },
        {

          back: "ArrowDown",
          left: "ArrowLeft",
          right: "ArrowRight",
          tLeft: "BracketLeft",
          tRight: "BracketRight",
          tUp: "Semicolon",
          tDown: "Quote",
          fire: "Enter",
          reload: "Numpad1",
          heal: "Numpad2",
          mine: "Numpad3",
        },
      ];

      const LAMBERT_MATERIAL = (color) =>
        new THREE.MeshLambertMaterial({ color });

      function createTrackTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 32;
        canvas.height = 128;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#3a3a3a";
        ctx.fillRect(0, 0, 32, 128);
        ctx.fillStyle = "#2a2a2a";
        for (let i = 0; i < 128; i += 8) {
          ctx.fillRect(0, i, 32, 4);
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }
      const trackMaterial = new THREE.MeshLambertMaterial({
        map: createTrackTexture(),
      });

      function createGroundTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#3c581a";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 8000; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 256;
          ctx.fillStyle = Math.random() > 0.7 ? "#6B8E23" : "#556B2F";
          ctx.fillRect(x, y, 2, 2);
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(32, 32);
        return texture;
      }

      function createExplosion(
        position,
        scale,
        isDust = false,
        isWater = false
      ) {
        const particleCount = isDust || isWater ? 15 : 20;
        for (let i = 0; i < particleCount * scale; i++) {
          let color;
          if (isWater) {
            color = Math.random() > 0.5 ? 0xadd8e6 : 0x87ceeb;
          } else if (isDust) {
            color = 0x966932;
          } else {
            color = Math.random() > 0.5 ? 0xffa500 : 0xff4500;
          }

          const particle = new THREE.Mesh(
            new THREE.SphereGeometry(0.2 * scale, 4, 4),
            new THREE.MeshBasicMaterial({
              color: color,
              transparent: true,
              opacity: isDust || isWater ? 0.7 : 1.0,
            })
          );
          particle.position.copy(position);
          particle.velocity = new THREE.Vector3(
            Math.random() - 0.5,
            isWater ? Math.random() * 0.8 : Math.random(),
            Math.random() - 0.5
          )
            .normalize()
            .multiplyScalar(
              Math.random() * (isDust || isWater ? 8 : 20) * scale
            );
          particle.lifespan = Math.random() * 0.8 + 0.3;
          gameObjects.particles.push(particle);
          scene.add(particle);
        }
      }

      function createStandardTank(color) {
        const tank = new THREE.Group();
        const hullGroup = new THREE.Group();
        const turretGroup = new THREE.Group();
        const hullMaterial = LAMBERT_MATERIAL(color);
        const hullWidth = 5.5,
          hullHeight = 1.8,
          hullLength = 9.0;
        const mainHull = new THREE.Mesh(
          new THREE.BoxGeometry(hullWidth, hullHeight, hullLength - 2),
          hullMaterial
        );
        mainHull.position.y = hullHeight / 2;
        hullGroup.add(mainHull);
        const glacis = new THREE.Mesh(
          new THREE.BoxGeometry(hullWidth, hullHeight * 1.2, 2.5),
          hullMaterial
        );
        glacis.position.set(0, hullHeight / 2 - 0.2, -hullLength / 2 + 0.5);
        glacis.rotation.x = -Math.PI / 6;
        hullGroup.add(glacis);
        const trackWidth = 1.2,
          trackHeight = 2.4,
          trackLength = hullLength + 1;
        const trackGroup = new THREE.Group();
        const leftTrack = new THREE.Mesh(
          new THREE.BoxGeometry(trackWidth, trackHeight, trackLength),
          trackMaterial
        );
        const rightTrack = leftTrack.clone();
        leftTrack.position.x = -hullWidth / 2 - trackWidth / 2;
        rightTrack.position.x = hullWidth / 2 + trackWidth / 2;
        trackGroup.add(leftTrack, rightTrack);
        tank.tracks = [leftTrack, rightTrack];
        const wheelGeom = new THREE.CylinderGeometry(
          0.8,
          0.8,
          trackWidth + 0.2,
          16
        );
        wheelGeom.rotateZ(Math.PI / 2);
        const wheelMaterial = new THREE.MeshLambertMaterial({
          color: 0x222222,
        });
        tank.wheels = [];
        for (let i = 0; i < 2; i++) {
          for (let j = 0; j < 5; j++) {
            const wheel = new THREE.Mesh(wheelGeom, wheelMaterial);
            wheel.position.set(
              i === 0
                ? -hullWidth / 2 - trackWidth / 2
                : hullWidth / 2 + trackWidth / 2,
              -0.2,
              -hullLength / 2 + 1 + j * 1.8
            );
            trackGroup.add(wheel);
            tank.wheels.push(wheel);
          }
        }
        trackGroup.position.y = trackHeight / 2 - 0.5;
        hullGroup.add(trackGroup);
        tank.add(hullGroup);
        const turretPoints = [
          new THREE.Vector3(2, 0, 2),
          new THREE.Vector3(2, 0, -2.5),
          new THREE.Vector3(-2, 0, -2.5),
          new THREE.Vector3(-2, 0, 2),
          new THREE.Vector3(1.5, 2, 1.5),
          new THREE.Vector3(1.5, 2, -2),
          new THREE.Vector3(-1.5, 2, -2),
          new THREE.Vector3(-1.5, 2, 1.5),
        ];
        const turretGeometry = new ConvexGeometry(turretPoints);
        turretGroup.add(
          new THREE.Mesh(
            turretGeometry,
            LAMBERT_MATERIAL(color.clone().offsetHSL(0, 0, 0.1))
          )
        );
        const mantlet = new THREE.Group();
        mantlet.add(
          new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 1.5, 1),
            LAMBERT_MATERIAL(0x444444)
          )
        );
        mantlet.position.set(0, 0.8, -2.5);
        turretGroup.add(mantlet);
        const barrel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.3, 0.2, 6, 12),
          LAMBERT_MATERIAL(0x333333)
        );
        barrel.rotation.x = Math.PI / 2;
        barrel.position.z = 3;
        mantlet.add(barrel);
        turretGroup.position.y = hullHeight + 0.1;
        turretGroup.position.z = 1;
        tank.add(turretGroup);
        tank.hullGroup = hullGroup;
        tank.turret = turretGroup;
        tank.mantlet = mantlet;
        tank.barrel = barrel;
        tank.position.y = 1.25;
        tank.userData.isTank = true;
        return tank;
      }
      function createPL01Tank(color) {
        const tank = new THREE.Group();
        const hullGroup = new THREE.Group();
        const turretGroup = new THREE.Group();
        const hullMaterial = LAMBERT_MATERIAL(color);
        const hullWidth = 6.0,
          hullHeight = 1.5,
          hullLength = 9.5;
        const mainHull = new THREE.Mesh(
          new THREE.BoxGeometry(hullWidth * 0.8, hullHeight, hullLength),
          hullMaterial
        );
        mainHull.position.y = hullHeight / 2;
        hullGroup.add(mainHull);
        const sidePanelGeom = new THREE.BoxGeometry(
          0.5,
          hullHeight * 1.5,
          hullLength
        );
        const leftPanel = new THREE.Mesh(sidePanelGeom, hullMaterial);
        leftPanel.position.set(-hullWidth / 2, hullHeight / 2, 0);
        leftPanel.rotation.z = 0.5;
        hullGroup.add(leftPanel);
        const rightPanel = new THREE.Mesh(sidePanelGeom, hullMaterial);
        rightPanel.position.set(hullWidth / 2, hullHeight / 2, 0);
        rightPanel.rotation.z = -0.5;
        hullGroup.add(rightPanel);
        tank.add(hullGroup);
        const trackWidth = 1.0,
          trackHeight = 1.8,
          trackLength = hullLength + 1;
        const trackGroup = new THREE.Group();
        const leftTrack = new THREE.Mesh(

      function setupEventListeners() {
        document.addEventListener("keydown", (e) => {
          keys[e.code] = true;
        });
        document.addEventListener("keyup", (e) => {
          keys[e.code] = false;
          if (!gameState.gameStarted) return;
          for (let i = 0; i < 2; i++) {
            if (e.code === CONTROLS[i].reload) startReload(i);
            if (e.code === CONTROLS[i].heal) healPlayer(i);
            if (e.code === CONTROLS[i].mine) dropMine(i);
          }
        });
        const menuEl = document.getElementById("menu"),
          mapEl = document.getElementById("map-overlay"),
          scoreEl = document.getElementById("score-overlay"),
          scoreDisplay = document.getElementById("score-display");
        const updatePauseState = () => {
          gameState.paused =
            menuEl.style.display === "flex" ||
            mapEl.style.display === "flex" ||
            scoreEl.style.display === "flex";
        };
        document.addEventListener("keydown", (e) => {
          if (!gameState.gameStarted) return;
          if (e.code === "Escape") {
            menuEl.style.display =
              menuEl.style.display === "flex" ? "none" : "flex";
          } else if (e.code === "KeyM") {
            mapEl.style.display =
              mapEl.style.display === "flex" ? "none" : "flex";
            if (mapEl.style.display === "flex") drawMap();
          } else if (e.code === "Tab") {
            e.preventDefault();
            const isVisible = scoreEl.style.display === "flex";
            scoreEl.style.display = isVisible ? "none" : "flex";
            if (!isVisible)
              scoreDisplay.innerText = `Gracz 1: ${gameState.scores.player1} - Gracz 2: ${gameState.scores.player2}`;
          }
          updatePauseState();
        });
      }

      function createCactus() {
        const cactus = new THREE.Group();
        const cactusMaterial = LAMBERT_MATERIAL(0x2e8b57);
        const basePadGeom = new THREE.SphereGeometry(1.5, 12, 8);
        const createPad = () => {
          const pad = new THREE.Mesh(basePadGeom, cactusMaterial);
          pad.scale.set(0.8, 1, 0.2);
          return pad;
        };
        const basePad = createPad();
        basePad.position.y = 1.5;
        cactus.add(basePad);
        let lastPad = basePad;
        const numPads = 2 + Math.floor(Math.random() * 4);
        for (let i = 0; i < numPads; i++) {
          const newPad = createPad();
          newPad.position.copy(lastPad.position);
          newPad.position.y += 1.3;
          newPad.position.x += (Math.random() < 0.5 ? -1 : 1) * 0.5;
          newPad.rotation.y = Math.random() * Math.PI;
          newPad.rotation.z = (Math.random() - 0.5) * 0.5;
          cactus.add(newPad);
          lastPad = newPad;
        }
        return cactus;
      }

      function handleControls(delta) {
        const tanks = [player1Tank, player2Tank];
        for (let i = 0; i < 2; i++) {
          const playerState = gameState.players[i];
          if (playerState.health <= 0 || playerState.isDestroyed) continue;

          const tank = tanks[i];
          const controls = CONTROLS[i];
          const oldPosition = tank.position.clone();
          const oldRotationY = tank.rotation.y;

          const tankStats = TANKS_DATA[playerState.tankType].stats;
          let moveSpeed = tankStats.speed * delta;
          if (playerState.activePowerUp === "turbo") {
            moveSpeed *= 4;
          }
          const rotateSpeed = tankStats.turretRot * delta;
          const wheelRotationSpeed = moveSpeed * 2.5;

          if (keys[controls.fwd]) {
            tank.translateZ(moveSpeed);
            tank.tracks.forEach(
              (t) => (t.material.map.offset.y += moveSpeed * 0.1)
            );
            tank.wheels.forEach((w) => (w.rotation.x += wheelRotationSpeed));
          }
          if (keys[controls.back]) {
            tank.translateZ(-moveSpeed);
            tank.tracks.forEach(
              (t) => (t.material.map.offset.y -= moveSpeed * 0.1)
            );
            tank.wheels.forEach((w) => (w.rotation.x -= wheelRotationSpeed));
          }
          if (keys[controls.left]) tank.rotation.y += rotateSpeed * 0.8;
          if (keys[controls.right]) tank.rotation.y -= rotateSpeed * 0.8;

          const otherTank = i === 0 ? player2Tank : player1Tank;
          const otherPlayerState =
            gameState.players[otherTank.userData.playerIndex];

          if (
            !otherPlayerState.isDestroyed &&
            tank.position.distanceTo(otherTank.position) < COLLISION_RADIUS
          ) {
            tank.position.copy(oldPosition);
            tank.rotation.y = oldRotationY;
          }

          if (keys[controls.tLeft]) tank.turret.rotation.y += rotateSpeed;
          if (keys[controls.tRight]) tank.turret.rotation.y -= rotateSpeed;
          if (keys[controls.tUp] && tank.mantlet.rotation.x > -0.5)
            tank.mantlet.rotation.x -= rotateSpeed * 0.5;
          if (keys[controls.tDown] && tank.mantlet.rotation.x < 0.2)
            tank.mantlet.rotation.x += rotateSpeed * 0.5;
          if (keys[controls.fire]) fire(i);
        }
      }

      function fire(playerIndex) {
        const playerState = gameState.players[playerIndex];
        if (playerState.isDestroyed || !playerState.canFire) return;

        switch (playerState.activePowerUp) {
          case "machinegun":
            fireMachineGun(playerIndex);
            break;
          case "missile":
            fireMissile(playerIndex);
            break;
          default:
            fireCannon(playerIndex);
            break;
        }
      }

      function fireCannon(playerIndex) {
        const playerState = gameState.players[playerIndex];
        if (playerState.isReloading || playerState.ammo <= 0) return;
        playerState.ammo--;
        playerState.canFire = false;

        const tank = playerIndex === 0 ? player1Tank : player2Tank;
        const projectile = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.25, 1.0, 4, 8),
          new THREE.MeshStandardMaterial({
            color: 0x333333,
            emissive: 0xffa500,
            emissiveIntensity: 2,
          })
        );
        projectile.rotation.x = Math.PI / 2;
        const direction = new THREE.Vector3();
        tank.barrel.getWorldDirection(direction);
        direction.y = 0;
        direction.normalize();
        const startPosition = new THREE.Vector3();
        tank.barrel.getWorldPosition(startPosition);
        projectile.position.copy(startPosition);
        projectile.velocity = direction.clone().multiplyScalar(160);
        projectile.ownerIndex = playerIndex;
        projectile.ownerTankType = playerState.tankType;
        gameObjects.projectiles.push(projectile);
        scene.add(projectile);
        setTimeout(() => {
          playerState.canFire = true;
        }, 500); // Standard cooldown
      }

      function fireMachineGun(playerIndex) {
        const playerState = gameState.players[playerIndex];
        playerState.canFire = false;

        const tank = playerIndex === 0 ? player1Tank : player2Tank;
        const bullet = new THREE.Mesh(
          new THREE.SphereGeometry(0.2, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0xffa500 })
        );
        const direction = new THREE.Vector3();
        tank.barrel.getWorldDirection(direction);
        direction.y = 0;
        direction.normalize();
        const startPosition = new THREE.Vector3();
        tank.barrel.getWorldPosition(startPosition);
        bullet.position.copy(startPosition);
        bullet.velocity = direction.clone().multiplyScalar(200);
        bullet.ownerIndex = playerIndex;
        bullet.lifespan = 2.0;
        gameObjects.machineGunBullets.push(bullet);
        scene.add(bullet);
        setTimeout(() => {
          playerState.canFire = true;
        }, 80); // Fast cooldown
      }

      function fireMissile(playerIndex) {
        const playerState = gameState.players[playerIndex];
        if (playerState.powerUpAmmo <= 0) return;
        playerState.powerUpAmmo--;
        playerState.canFire = false;

        const tank = playerIndex === 0 ? player1Tank : player2Tank;
        const missile = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.5, 0.5, 3, 12),
          LAMBERT_MATERIAL(0xcccccc)
        );
        const tip = new THREE.Mesh(
          new THREE.ConeGeometry(0.5, 1, 12),
          LAMBERT_MATERIAL(0xff0000)
        );
        tip.position.y = 1.5;
        missile.add(body, tip);
        missile.rotation.x = Math.PI / 2;

        const startPosition = new THREE.Vector3();
        tank.barrel.getWorldPosition(startPosition);
        missile.position.copy(startPosition);
        missile.quaternion.copy(tank.barrel.getWorldQuaternion());
        missile.ownerIndex = playerIndex;
        missile.ownerTankType = playerState.tankType;
        missile.target = playerIndex === 0 ? player2Tank : player1Tank;
        missile.lifespan = 10;
        gameObjects.missiles.push(missile);
        scene.add(missile);

        deactivatePowerUp(playerIndex);
        setTimeout(() => {
          playerState.canFire = true;
        }, 1000); // Cooldown after missile shot
      }

      function dropMine(playerIndex) {
        const playerState = gameState.players[playerIndex];
        if (
          playerState.activePowerUp !== "mines" ||
          playerState.powerUpAmmo <= 0
        )
          return;
        playerState.powerUpAmmo--;

        const tank = playerIndex === 0 ? player1Tank : player2Tank;
        const mine = new THREE.Mesh(
          new THREE.CylinderGeometry(1.2, 1.2, 0.5, 16),
          LAMBERT_MATERIAL(0x444444)
        );
        const minePos = tank.position
          .clone()
          .add(new THREE.Vector3(0, 0, 7).applyQuaternion(tank.quaternion));
        mine.position.set(minePos.x, 0.25, minePos.z);
        mine.ownerIndex = playerIndex;
        gameObjects.mines.push(mine);
        scene.add(mine);

        if (playerState.powerUpAmmo <= 0) {
          deactivatePowerUp(playerIndex);
        }
      }

      function healPlayer(playerIndex) {
        const playerState = gameState.players[playerIndex];
        const maxHealth = TANKS_DATA[playerState.tankType].stats.hp;
        if (
          playerState.medkits > 0 &&
          playerState.health > 0 &&
          playerState.health < maxHealth
        ) {
          playerState.medkits--;
          playerState.health += 40;
          playerState.health = Math.min(playerState.health, maxHealth);
          updateHUD();
        }
      }

      function updateProjectiles(delta) {
        for (let i = gameObjects.projectiles.length - 1; i >= 0; i--) {
          const p = gameObjects.projectiles[i];
          p.position.add(p.velocity.clone().multiplyScalar(delta));
          let destroyed = false;

          const targets = [player1Tank, player2Tank];
          for (const target of targets) {
            const targetState = gameState.players[target.userData.playerIndex];
            if (
              p.ownerIndex !== target.userData.playerIndex &&
              !targetState.isDestroyed
            ) {
              if (p.position.distanceTo(target.position) < 5) {
                const damage = TANKS_DATA[p.ownerTankType].stats.damage;
                handleDamage(target, damage);
                createExplosion(p.position, 1.5);
                destroyed = true;
                break;
              }
            }
          }
          if (destroyed) {
            scene.remove(p);
            p.geometry.dispose();
            p.material.dispose();
            gameObjects.projectiles.splice(i, 1);
            continue;
          }

          for (let j = gameObjects.houses.length - 1; j >= 0; j--) {
            const house = gameObjects.houses[j];
            if (p.position.distanceTo(house.position) < 12) {
              house.userData.health--;
              createExplosion(p.position, 1.0, true);
              if (house.userData.health <= 0) {
                destroyHouse(house);
                gameObjects.houses.splice(j, 1);
              }
              destroyed = true;
              break;
            }
          }
          if (destroyed) {
            scene.remove(p);
            p.geometry.dispose();
            p.material.dispose();
            gameObjects.projectiles.splice(i, 1);
            continue;
          }

          if (p.position.y <= 0.2) {
            createExplosion(p.position, 0.8, true);
            destroyed = true;
          }
          if (destroyed) {
            scene.remove(p);
            p.geometry.dispose();
            p.material.dispose();
            gameObjects.projectiles.splice(i, 1);
          }
        }
      }

      function handleDamage(target, amount) {
        const playerIndex = target.userData.playerIndex;
        const playerState = gameState.players[playerIndex];
        if (playerState.health <= 0) return;
        playerState.health -= amount;
        if (playerState.health <= 0) {
          playerState.health = 0;
          const winnerIndex = playerIndex === 0 ? 1 : 0;
          if (winnerIndex === 0) gameState.scores.player1++;
          else gameState.scores.player2++;
          playerState.isDestroyed = true;
          playerState.respawnTimer = 3.0;
          destroyTank(target);
          showTankQuote(playerIndex);
        } else {
          if (Math.random() > 0.6) {
            showTankQuote(playerIndex);
          }
        }
      }

      function destroyTank(tank) {
        createExplosion(tank.position, 4);
        tank.visible = false;
        const partsToDestroy = [tank.hullGroup, tank.turret];
        partsToDestroy.forEach((part) => {
          const wreckClone = part.clone();
          part.getWorldPosition(wreckClone.position);
          part.getWorldQuaternion(wreckClone.quaternion);
          scene.add(wreckClone);
          const wreckObject = {
            object: wreckClone,
            velocity: new THREE.Vector3(
              (Math.random() - 0.5) * 15,
              Math.random() * 15 + 5,
              (Math.random() - 0.5) * 15
            ),
            angularVelocity: new THREE.Vector3(
              (Math.random() - 0.5) * 5,
              (Math.random() - 0.5) * 5,
              (Math.random() - 0.5) * 5
            ),
            lifespan: 10.0,
          };
          gameObjects.wreckage.push(wreckObject);
        });
      }

      function destroyHouse(house) {
        createExplosion(house.position, 5, true);
        house.visible = false;
        const partsToDestroy = [house.userData.body, house.userData.roof];
        partsToDestroy.forEach((part) => {
          const wreckClone = part.clone();
          house.getWorldPosition(wreckClone.position);
          wreckClone.position.y += part.position.y;
          house.getWorldQuaternion(wreckClone.quaternion);

          scene.add(wreckClone);
          const wreckObject = {
            object: wreckClone,
            velocity: new THREE.Vector3(
              (Math.random() - 0.5) * 10,
              Math.random() * 10 + 2,
              (Math.random() - 0.5) * 10
            ),
            angularVelocity: new THREE.Vector3(
              (Math.random() - 0.5) * 2,
              (Math.random() - 0.5) * 2,
              (Math.random() - 0.5) * 2
            ),
            lifespan: 15.0,
          };
          gameObjects.wreckage.push(wreckObject);
        });
        scene.remove(house);
      }

      function updateWreckage(delta) {
        const gravity = -30;
        for (let i = gameObjects.wreckage.length - 1; i >= 0; i--) {
          const wreck = gameObjects.wreckage[i];
          wreck.lifespan -= delta;
          if (wreck.lifespan <= 0) {
            scene.remove(wreck.object);
            wreck.object.traverse((child) => {
              if (child.isMesh) {
                child.geometry.dispose();
                child.material.dispose();
              }
            });
            gameObjects.wreckage.splice(i, 1);
            continue;
          }
          if (wreck.object.position.y > 0) {
            wreck.velocity.y += gravity * delta;
            wreck.object.position.add(
              wreck.velocity.clone().multiplyScalar(delta)
            );
            wreck.object.rotation.x += wreck.angularVelocity.x * delta;
            wreck.object.rotation.y += wreck.angularVelocity.y * delta;
            wreck.object.rotation.z += wreck.angularVelocity.z * delta;
          } else {
            wreck.object.position.y = 0;
          }
        }
      }

      function checkRespawns(delta) {
        for (let i = 0; i < 2; i++) {
          const playerState = gameState.players[i];
          const respawnMsgEl = document.getElementById(
            `respawn-message-${i + 1}`
          );
          if (playerState.isDestroyed) {
            playerState.respawnTimer -= delta;
            respawnMsgEl.style.display = "block";
            respawnMsgEl.innerText = `ODRODZENIE ZA: ${Math.ceil(
              Math.max(0, playerState.respawnTimer)
            )}`;

            if (playerState.respawnTimer <= 0) {
              respawnPlayer(i);
              respawnMsgEl.style.display = "none";
            }
          }
        }
      }

      function checkDrowning() {
        const tanks = [player1Tank, player2Tank];
        for (let i = 0; i < 2; i++) {
          const tank = tanks[i];
          const playerState = gameState.players[i];
          if (playerState.isDestroyed) continue;

          let isDrowning = false;
          // Sprawdzanie krawędzi mapy
          if (
            Math.abs(tank.position.x) > MAP_SIZE / 2 ||
            Math.abs(tank.position.z) > MAP_SIZE / 2
          ) {
            isDrowning = true;
          }

          // Sprawdzanie rzek
          if (!isDrowning) {
            for (const river of gameObjects.rivers) {
              const halfWidth = river.width / 2;
              const halfLength = river.length / 2;
              if (
                tank.position.x > river.x - halfWidth &&
                tank.position.x < river.x + halfWidth &&
                tank.position.z > river.z - halfLength &&
                tank.position.z < river.z + halfLength
              ) {
                // Jest w strefie rzeki, sprawdź czy nie jest na moście
                let onBridge = false;
                for (const bridge of gameObjects.bridges) {
                  if (
                    tank.position.distanceTo(bridge.position) <
                    bridge.geometry.parameters.depth / 1.5
                  ) {
                    onBridge = true;
                    break;
                  }
                }
                if (!onBridge) {
                  isDrowning = true;
                }
              }
            }
          }

          if (isDrowning) {
            const drownPosition = tank.position.clone();
            drownPosition.y = WATER_LEVEL + 1;
            createExplosion(drownPosition, 4, false, true);
            handleDamage(tank, 9999);
          }
        }
      }

      function checkFenceCollisions() {
        const tanks = [player1Tank, player2Tank];
        for (const tank of tanks) {
          if (gameState.players[tank.userData.playerIndex].isDestroyed)
            continue;
          for (let i = gameObjects.fences.length - 1; i >= 0; i--) {
            const fence = gameObjects.fences[i];
            if (
              tank.position.distanceTo(fence.position) < FENCE_COLLISION_RADIUS
            ) {
              createExplosion(fence.position, 1.0, true);
              scene.remove(fence);
              gameObjects.fences.splice(i, 1);
            }
          }
        }
      }

      function checkToiletCollisions() {
        const tanks = [player1Tank, player2Tank];
        for (let i = 0; i < tanks.length; i++) {
          const tank = tanks[i];
          if (gameState.players[i].isDestroyed) continue;
          for (let j = gameObjects.toilets.length - 1; j >= 0; j--) {
            const toilet = gameObjects.toilets[j];
            if (tank.position.distanceTo(toilet.position) < 5) {
              createExplosion(toilet.position, 2.0);
              gameState.players[i].ammo = 8;
              scene.remove(toilet);
              gameObjects.toilets.splice(j, 1);
            }
          }
        }
      }

      function respawnPlayer(playerIndex) {
        const playerState = gameState.players[playerIndex];
        const tank = playerIndex === 0 ? player1Tank : player2Tank;
        const startY = TANKS_DATA[playerState.tankType].startY;
        const startPosition =
          playerIndex === 0
            ? new THREE.Vector3(-20, startY, 0)
            : new THREE.Vector3(20, startY, 0);

        playerState.health = TANKS_DATA[playerState.tankType].stats.hp;
        playerState.ammo = 8;
        playerState.isDestroyed = false;

        tank.position.copy(startPosition);
        tank.rotation.set(0, playerIndex === 0 ? 0 : Math.PI, 0);
        tank.turret.rotation.set(0, 0, 0);
        tank.mantlet.rotation.set(0, 0, 0);
        tank.visible = true;
      }

      function updateHUD() {
        if (!gameState.gameStarted) return;
        for (let i = 0; i < 2; i++) {
          if (!gameState.players[i].tankType) continue;
          const playerState = gameState.players[i];
          const maxHealth = TANKS_DATA[playerState.tankType].stats.hp;
          const hpVal = document.getElementById(`hp-value-${i + 1}`);
          const hpBar = document.getElementById(`hp-bar-${i + 1}`);
          const ammo = document.getElementById(`ammo-value-${i + 1}`);
          const med = document.getElementById(`medkits-value-${i + 1}`);
          const powerupHUD = document.getElementById(`powerup-hud-${i + 1}`);

          if (!hpVal) continue;
          hpVal.innerText = `${Math.max(
            0,
            playerState.health.toFixed(0)
          )} / ${maxHealth}`;
          const hpPercent = (Math.max(0, playerState.health) / maxHealth) * 100;
          hpBar.style.width = `${hpPercent}%`;
          hpBar.className = `hud-bar-fill ${hpPercent < 30 ? "low" : ""}`;
          ammo.innerText = `${playerState.ammo} / 8`;
          med.innerText = playerState.medkits;

          if (playerState.activePowerUp) {
            powerupHUD.style.display = "block";
            let text = "";
            switch (playerState.activePowerUp) {
              case "turbo":
                text = `TURBO: ${playerState.powerUpTimer.toFixed(1)}s`;
                break;
              case "machinegun":
                text = `KARABIN: ${playerState.powerUpTimer.toFixed(1)}s`;
                break;
              case "missile":
                text = `RAKIETA: ${playerState.powerUpAmmo}x`;
                break;
              case "mines":
                text = `MINY: ${playerState.powerUpAmmo}x`;
                break;
            }
            powerupHUD.innerText = text;
          } else {
            powerupHUD.style.display = "none";
          }
        }
      }
      function drawMap() {
        const canvas = document.getElementById("map-container");
        const ctx = canvas.getContext("2d");
        const w = canvas.width,
          h = canvas.height;
        ctx.fillStyle = "rgba(20, 40, 20, 0.8)";
        ctx.fillRect(0, 0, w, h);
        const mapX = (x) => (x / MAP_SIZE) * w + w / 2;
        const mapZ = (z) => (z / MAP_SIZE) * h + h / 2;

        // Rzeki
        ctx.fillStyle = "rgba(0, 30, 61, 0.8)";
        gameObjects.rivers.forEach((river) => {
          ctx.fillRect(
            mapX(river.x - river.width / 2),
            mapZ(river.z - river.length / 2),
            (river.width / MAP_SIZE) * w,
            (river.length / MAP_SIZE) * h
          );
        });

        // Mosty
        ctx.fillStyle = "#888888";
        gameObjects.bridges.forEach((bridge) => {
          ctx.fillRect(
            mapX(bridge.position.x - bridge.geometry.parameters.width / 2),
            mapZ(bridge.position.z - bridge.geometry.parameters.depth / 2),
            (bridge.geometry.parameters.width / MAP_SIZE) * w,
            (bridge.geometry.parameters.depth / MAP_SIZE) * h
          );
        });

        // Domy
        ctx.fillStyle = "#A0522D";
        gameObjects.houses.forEach((house) => {
          ctx.fillRect(
            mapX(house.position.x) - 6,
            mapZ(house.position.z) - 8,
            12,
            16
          );
        });

        // Toalety
        ctx.fillStyle = "yellow";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        gameObjects.toilets.forEach((toilet) => {
          const x = mapX(toilet.position.x);
          const z = mapZ(toilet.position.z);
          ctx.fillRect(x - 4, z - 4, 8, 8);
          ctx.fillText("WC", x, z - 5);
        });

        // Gracze
        if (!gameState.players[0].isDestroyed) {
          ctx.fillStyle = "#38A849";
          ctx.beginPath();
          ctx.arc(
            mapX(player1Tank.position.x),
            mapZ(player1Tank.position.z),
            5,
            0,
            2 * Math.PI
          );
          ctx.fill();
        }
        if (!gameState.players[1].isDestroyed) {
          ctx.fillStyle = "#35A8D4";
          ctx.beginPath();
          ctx.arc(
            mapX(player2Tank.position.x),
            mapZ(player2Tank.position.z),
            5,
            0,
            2 * Math.PI
          );
          ctx.fill();
        }
      }

      function updateParticles(delta) {
        const gravity = -9.8;
        for (let i = gameObjects.particles.length - 1; i >= 0; i--) {
          const p = gameObjects.particles[i];
          p.lifespan -= delta;
          if (p.lifespan <= 0) {
            scene.remove(p);
            p.geometry.dispose();
            p.material.dispose();
            gameObjects.particles.splice(i, 1);
          } else {
            p.velocity.y += gravity * delta;
            p.position.add(p.velocity.clone().multiplyScalar(delta));
            p.scale.multiplyScalar(0.97);
            if (p.material.transparent)
              p.material.opacity = (p.lifespan / 0.8) * 0.7;
          }
        }
      }

      function showTankQuote(playerIndex) {
        if (gameState.players[playerIndex].isDestroyed) return;
        const bubble = document.getElementById(`bubble-${playerIndex + 1}`);
        bubble.innerText =
          TANK_QUOTES[Math.floor(Math.random() * TANK_QUOTES.length)];
        bubble.style.display = "block";
        setTimeout(() => {
          bubble.style.display = "none";
        }, 4000);
      }

      function updateBubbles() {
        const tanks = [player1Tank, player2Tank];
        const cameras = [camera1, camera2];
        const viewports = [
          {
            left: 0,
            width: window.innerWidth / 2,
          },
          {
            left: window.innerWidth / 2,
            width: window.innerWidth / 2,
          },
        ];

        // Update bubble for Player 1
        const bubble1 = document.getElementById("bubble-1");
        if (bubble1.style.display !== "none" && player1Tank) {
          const vector = new THREE.Vector3(
            player1Tank.position.x,
            player1Tank.position.y + 6,
            player1Tank.position.z
          );
          vector.project(camera1); // Project on its own camera for best accuracy on its screen
          const x =
            (vector.x * viewports[0].width) / 2 + viewports[0].width / 2;
          const y =
            -(vector.y * window.innerHeight) / 2 + window.innerHeight / 2;
          bubble1.style.left = `${x}px`;
          bubble1.style.top = `${y}px`;
        }

        // Update bubble for Player 2
        const bubble2 = document.getElementById("bubble-2");
        if (bubble2.style.display !== "none" && player2Tank) {
          const vector = new THREE.Vector3(
            player2Tank.position.x,
            player2Tank.position.y + 6,
            player2Tank.position.z
          );
          vector.project(camera2); // Project on its own camera
          const x =
            (vector.x * viewports[1].width) / 2 +
            viewports[1].left +
            viewports[1].width / 2;
          const y =
            -(vector.y * window.innerHeight) / 2 + window.innerHeight / 2;
          bubble2.style.left = `${x}px`;
          bubble2.style.top = `${y}px`;
        }
      }

      function updateCrateSpawning(delta) {
        crateSpawnTimer -= delta;
        if (crateSpawnTimer <= 0) {
          spawnCrate();
          crateSpawnTimer = 20.0;
        }
      }

      function spawnCrate() {
        const crate = new THREE.Group();
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(3, 3, 3),
          LAMBERT_MATERIAL(0xdaa520)
        );
        const questionMarkCanvas = document.createElement("canvas");
        questionMarkCanvas.width = 128;
        questionMarkCanvas.height = 128;
        const ctx = questionMarkCanvas.getContext("2d");
        ctx.fillStyle = "#8B4513";
        ctx.fillRect(0, 0, 128, 128);
        ctx.font = "bold 100px Arial";
        ctx.fillStyle = "yellow";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("?", 64, 64);
        const qmTexture = new THREE.CanvasTexture(questionMarkCanvas);
        box.material = new THREE.MeshLambertMaterial({ map: qmTexture });

        const parachute = new THREE.Mesh(
          new THREE.SphereGeometry(6, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
          LAMBERT_MATERIAL(0xeeeeee)
        );
        parachute.position.y = 5;
        crate.add(box, parachute);
        crate.position.set(
          (Math.random() - 0.5) * (MAP_SIZE - 40),
          150,
          (Math.random() - 0.5) * (MAP_SIZE - 40)
        );
        crate.userData.powerUpType =
          POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
        crate.userData.parachute = parachute;
        gameObjects.crates.push(crate);
        scene.add(crate);
      }

      function updateCrates(delta) {
        const tanks = [player1Tank, player2Tank];
        for (let i = gameObjects.crates.length - 1; i >= 0; i--) {
          const crate = gameObjects.crates[i];
          if (crate.position.y > 1.5) {
            crate.position.y -= 20 * delta;
          } else {
            crate.position.y = 1.5;
            if (crate.userData.parachute) {
              crate.remove(crate.userData.parachute);
              crate.userData.parachute = null;
            }
          }

          for (const tank of tanks) {
            if (
              !gameState.players[tank.userData.playerIndex].isDestroyed &&
              tank.position.distanceTo(crate.position) < 5
            ) {
              activatePowerUp(
                tank.userData.playerIndex,
                crate.userData.powerUpType
              );
              scene.remove(crate);
              gameObjects.crates.splice(i, 1);
              break;
            }
          }
        }
      }

      function activatePowerUp(playerIndex, type) {
        const playerState = gameState.players[playerIndex];
        playerState.activePowerUp = type;
        switch (type) {
          case "turbo":
            playerState.powerUpTimer = 10;
            break;
          case "machinegun":
            playerState.powerUpTimer = 15;
            break;
          case "missile":
            playerState.powerUpAmmo = 1;
            break;
          case "mines":
            playerState.powerUpAmmo = 5;
            break;
        }
      }

      function deactivatePowerUp(playerIndex) {
        const playerState = gameState.players[playerIndex];
        playerState.activePowerUp = null;
        playerState.powerUpTimer = 0;
        playerState.powerUpAmmo = 0;
      }

      function updatePowerUps(delta) {
        for (let i = 0; i < 2; i++) {
          const playerState = gameState.players[i];
          if (playerState.powerUpTimer > 0) {
            playerState.powerUpTimer -= delta;
            if (playerState.powerUpTimer <= 0) {
              deactivatePowerUp(i);
            }
          }
        }
      }

      function updateSpecialProjectiles(delta) {
        // Update Machine Gun Bullets
        for (let i = gameObjects.machineGunBullets.length - 1; i >= 0; i--) {
          const b = gameObjects.machineGunBullets[i];
          b.position.add(b.velocity.clone().multiplyScalar(delta));
          b.lifespan -= delta;
          let hit = false;
          const otherTank = b.ownerIndex === 0 ? player2Tank : player1Tank;
          if (
            !gameState.players[otherTank.userData.playerIndex].isDestroyed &&
            b.position.distanceTo(otherTank.position) < 5
          ) {
            handleDamage(otherTank, 3); // Niskie obrażenia
            hit = true;
          }
          if (hit || b.lifespan <= 0) {
            scene.remove(b);
            gameObjects.machineGunBullets.splice(i, 1);
          }
        }

        // Update Missiles
        for (let i = gameObjects.missiles.length - 1; i >= 0; i--) {
          const m = gameObjects.missiles[i];
          const target = m.target;
          m.lifespan -= delta;

          if (
            !gameState.players[target.userData.playerIndex].isDestroyed &&
            m.lifespan > 0
          ) {
            const direction = new THREE.Vector3()
              .subVectors(target.position, m.position)
              .normalize();
            m.quaternion.slerp(
              new THREE.Quaternion().setFromUnitVectors(
                new THREE.Vector3(0, 1, 0),
                direction
              ),
              0.08
            );
            m.position.add(direction.multiplyScalar(60 * delta));

            if (m.position.distanceTo(target.position) < 5) {
              const damage = TANKS_DATA[m.ownerTankType].stats.damage * 2;
              handleDamage(target, damage);
              createExplosion(m.position, 4);
              scene.remove(m);
              gameObjects.missiles.splice(i, 1);
            }
          } else {
            // Cel zniszczony lub czas życia upłynął
            createExplosion(m.position, 2);
            scene.remove(m);
            gameObjects.missiles.splice(i, 1);
          }
        }

        // Update Mines
        const tanks = [player1Tank, player2Tank];
        for (let i = gameObjects.mines.length - 1; i >= 0; i--) {
          const mine = gameObjects.mines[i];
          for (const tank of tanks) {
            if (
              mine.ownerIndex !== tank.userData.playerIndex &&
              !gameState.players[tank.userData.playerIndex].isDestroyed &&
              tank.position.distanceTo(mine.position) < 3
            ) {
              handleDamage(tank, 50);
              createExplosion(mine.position, 4);
              scene.remove(mine);
              gameObjects.mines.splice(i, 1);
              break;
            }
          }
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        if (!gameState.gameStarted) return;
        const delta = clock.getDelta();
        if (!gameState.paused) {
          updateCrateSpawning(delta);
          handleControls(delta);
          updateProjectiles(delta);
          updateSpecialProjectiles(delta);
          updateParticles(delta);
          updateWreckage(delta);
          checkRespawns(delta);
          checkDrowning();
          checkFenceCollisions();
          checkToiletCollisions();
          updateCrates(delta);
          updatePowerUps(delta);
          updateBubbles();

          const offset = new THREE.Vector3(0, 20, 35);
          if (player1Tank) {
            const targetPos1 = player1Tank.position.clone().add(offset);
            camera1.position.lerp(targetPos1, 0.1);
            camera1.lookAt(
              player1Tank.position.clone().add(new THREE.Vector3(0, 2, 0))
            );
          }
          if (player2Tank) {
            const targetPos2 = player2Tank.position.clone().add(offset);
            camera2.position.lerp(targetPos2, 0.1);
            camera2.lookAt(
              player2Tank.position.clone().add(new THREE.Vector3(0, 2, 0))
            );
          }
        }
        if (document.getElementById("map-overlay").style.display === "flex")
          drawMap();
        updateHUD();
        renderer.setViewport(0, 0, window.innerWidth / 2, window.innerHeight);
        renderer.setScissor(0, 0, window.innerWidth / 2, window.innerHeight);
        if (camera1) renderer.render(scene, camera1);
        renderer.setViewport(
          window.innerWidth / 2,
          0,
          window.innerWidth / 2,
          window.innerHeight
        );
        renderer.setScissor(
          window.innerWidth / 2,
          0,
          window.innerWidth / 2,
          window.innerHeight
        );
        if (camera2) renderer.render(scene, camera2);
      }

      initializeUI();
    </script>
  </body>
</html>
