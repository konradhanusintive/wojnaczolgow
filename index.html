<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wojna Czołgów 3D - Edycja Ostateczna</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="intro-screen" class="overlay">
      <img id="intro-logo" src="Logo.png" alt="Logo Gry Wojna Czołgów" />
    </div>

    <div id="start-screen" class="overlay" style="display: none">
      <h1 id="selection-title">Gracz 1 Wybiera Czołg</h1>
      <div class="tank-selection-container">
        <div class="tank-card" id="select-pl01">
          <h3>PL-01 Concept</h3>
          <canvas id="canvas-pl01" class="tank-canvas"></canvas>
          <div class="stats-container">
            <div class="stat-line">
              <span>Życie</span>
              <div class="stat-bar-container">
                <div id="bar-pl01-hp" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Obrażenia</span>
              <div class="stat-bar-container">
                <div id="bar-pl01-dmg" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Prędkość</span>
              <div class="stat-bar-container">
                <div id="bar-pl01-spd" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Obrót Wieży</span>
              <div class="stat-bar-container">
                <div id="bar-pl01-rot" class="stat-bar-fill"></div>
              </div>
            </div>
          </div>
          <button class="select-button">Wybierz</button>
        </div>
        <div class="tank-card locked" id="select-abrams">
          <div class="premium-label">PREMIUM</div>
          <h3>M1 Abrams</h3>
          <canvas id="canvas-abrams" class="tank-canvas"></canvas>
          <div class="stats-container">
            <div class="stat-line">
              <span>Życie</span>
              <div class="stat-bar-container">
                <div id="bar-abrams-hp" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Obrażenia</span>
              <div class="stat-bar-container">
                <div id="bar-abrams-dmg" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Prędkość</span>
              <div class="stat-bar-container">
                <div id="bar-abrams-spd" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Obrót Wieży</span>
              <div class="stat-bar-container">
                <div id="bar-abrams-rot" class="stat-bar-fill"></div>
              </div>
            </div>
          </div>
          <button class="select-button" disabled>Wybierz</button>
        </div>
        <div class="tank-card" id="select-standard">
          <h3>Standard</h3>
          <canvas id="canvas-standard" class="tank-canvas"></canvas>
          <div class="stats-container">
            <div class="stat-line">
              <span>Życie</span>
              <div class="stat-bar-container">
                <div id="bar-standard-hp" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Obrażenia</span>
              <div class="stat-bar-container">
                <div id="bar-standard-dmg" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Prędkość</span>
              <div class="stat-bar-container">
                <div id="bar-standard-spd" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Obrót Wieży</span>
              <div class="stat-bar-container">
                <div id="bar-standard-rot" class="stat-bar-fill"></div>
              </div>
            </div>
          </div>
          <button class="select-button">Wybierz</button>
        </div>
      </div>
    </div>

    <div id="hud-left" class="hud"></div>
    <div id="hud-right" class="hud"></div>
    <div id="message-display" class="message"></div>
    <div
      id="respawn-message-1"
      class="respawn-message"
      style="display: none"
    ></div>
    <div
      id="respawn-message-2"
      class="respawn-message"
      style="display: none"
    ></div>
    <div id="bubble-1" class="speech-bubble" style="display: none"></div>
    <div id="bubble-2" class="speech-bubble" style="display: none"></div>
    <div id="menu" class="overlay" style="display: none">
      <h1>PAUZA</h1>
      <p>Naciśnij ESC</p>
    </div>
    <div id="map-overlay" class="overlay" style="display: none">
      <h1>MAPA</h1>
      <canvas id="map-container" width="400" height="400"></canvas>
      <p>Naciśnij M</p>
    </div>
    <div id="score-overlay" class="overlay" style="display: none">
      <h1>WYNIK</h1>
      <p id="score-display" style="font-size: 2.5em"></p>
      <p>Naciśnij TAB</p>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
  </body>
</html>
