<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wojna Czołgów 3D - Edycja Ostateczna</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: white;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        z-index: 50;
      }
      /* Intro Screen */
      #intro-screen {
        background-color: #000;
        z-index: 100;
      }
      #intro-logo {
        max-width: 500px;
        width: 90%;
        height: auto;
        animation: fadeInOut 4s ease-in-out forwards;
      }
      @keyframes fadeInOut {
        0% {
          opacity: 0;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(0.95);
        }
      }
      /* Tank Selection Screen */
      #start-screen {
        background: url("https://www.transparenttextures.com/patterns/carbon-fibre.png"),
          rgba(0, 0, 0, 0.9);
      }
      #selection-title {
        font-size: 3em;
        color: #ffc107;
        text-shadow: 2px 2px 4px #000;
        margin-bottom: 20px;
      }
      .tank-selection-container {
        display: flex;
        justify-content: center;
        gap: 30px;
        width: 90%;
        max-width: 1200px;
      }
      .tank-card {
        border: 2px solid #555;
        border-radius: 10px;
        background-color: rgba(20, 20, 20, 0.7);
        padding: 20px;
        width: 300px;
        transition: transform 0.2s, box-shadow 0.2s;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .tank-card:not(.locked):hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 20px rgba(255, 193, 7, 0.3);
        border-color: #ffc107;
      }
      .tank-card.locked {
        opacity: 0.6;
      }
      /* NOWOŚĆ: Canvas dla miniaturek */
      .tank-canvas {
        width: 100%;
        height: 150px;
        margin-bottom: 15px;
        border-radius: 5px;
      }
      .premium-label {
        position: absolute;
        top: -15px;
        right: -15px;
        background: #ffc107;
        color: #000;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
        transform: rotate(15deg);
      }
      .tank-card h3 {
        color: #ffc107;
        margin-top: 0;
        font-size: 1.5em;
      }
      .stats-container {
        text-align: left;
        margin: 15px 0;
        font-size: 0.9em;
      }
      .stat-line {
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .stat-bar-container {
        width: 60%;
        background: #333;
        border-radius: 5px;
        height: 15px;
        border: 1px solid #777;
      }
      .stat-bar-fill {
        background: linear-gradient(90deg, #dc3545, #ffc107, #28a745);
        height: 100%;
        border-radius: 4px;
      }
      .select-button {
        background: #28a745;
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 1em;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: auto; /* Push button to the bottom */
      }
      .select-button:hover {
        background: #218838;
      }
      .select-button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      /* Pozostałe style (HUD, wiadomości itp.) */
      .key {
        display: inline-block;
        padding: 5px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #333;
        color: #fff;
        min-width: 20px;
        text-align: center;
        margin-right: 10px;
      }
      .hud {
        position: absolute;
        bottom: 20px;
        color: white;
        font-family: "Consolas", "Lucida Console", monospace;
        font-size: 1.1em;
        background-color: rgba(0, 0, 0, 0.6);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        min-width: 260px;
        box-sizing: border-box;
        z-index: 10;
      }
      #hud-left {
        left: 20px;
      }
      #hud-right {
        right: 20px;
      }
      .hud-line {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
      }
      .hud-bar {
        background: #555;
        border-radius: 5px;
        overflow: hidden;
        height: 20px;
        border: 1px solid #888;
      }
      .hud-bar-fill {
        background: #28a745;
        width: 100%;
        height: 100%;
        transition: width 0.5s;
      }
      .hud-bar-fill.low {
        background: #dc3545;
      }
      .message {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: #ffc107;
        font-size: 2em;
        font-family: "Arial Black", sans-serif;
        text-shadow: 2px 2px 4px #000;
        display: none;
        text-align: center;
        z-index: 20;
      }
      #message-display {
        bottom: 150px;
      }
    </style>
  </head>

            <div class="stat-line">

          <h3>Standard</h3>
          <canvas id="canvas-standard" class="tank-canvas"></canvas>
          <div class="stats-container">
            <div class="stat-line">
              <span>Życie</span>
              <div class="stat-bar-container">
                <div id="bar-standard-hp" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">
              <span>Obrażenia</span>
              <div class="stat-bar-container">
                <div id="bar-standard-dmg" class="stat-bar-fill"></div>
              </div>
            </div>
            <div class="stat-line">

    <div id="hud-left" class="hud"></div>
    <div id="hud-right" class="hud"></div>
    <div id="message-display" class="message"></div>

    <div id="map-overlay" class="overlay" style="display: none">

    <div id="score-overlay" class="overlay" style="display: none">
      <h1>WYNIK</h1>
      <p
        id="score-display"
        style="font-size: 2.5em; margin: 20px 0; color: #ffc107"

      <p>Naciśnij TAB, aby wrócić</p>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { ConvexGeometry } from "three/addons/geometries/ConvexGeometry.js";

      let scene, renderer, clock;
      let camera1, camera2;
      let player1Tank, player2Tank;
      let selectionRenderers = []; // Dla miniaturek czołgów

      const keys = {};
      const gameObjects = {
        projectiles: [],
        particles: [],
        toilets: [],
        wreckage: [],
      };
      const MAP_SIZE = 500;

      const TANKS_DATA = {
        pl01: {
          name: "PL-01 Concept",
          stats: { hp: 85, damage: 22, speed: 18, turretRot: 1.8 },
          create: createPL01Tank,
        },
        abrams: {
          name: "M1 Abrams",
          stats: { hp: 130, damage: 35, speed: 12, turretRot: 1.2 },
          create: createAbramsTank,
        },
        standard: {
          name: "Standard",
          stats: { hp: 100, damage: 25, speed: 15, turretRot: 1.5 },
          create: createStandardTank,
        },
      };

      const gameState = {
        gameStarted: false,
        paused: false,
        selectionComplete: false,
        turn: 1,
        scores: { player1: 0, player2: 0 },
        players: [
          {
            tankType: null,
            health: 0,
            ammo: 8,
            medkits: 3,
            isReloading: false,
            canFire: true,
            isDestroyed: false,
            respawnTimer: 0,
          },
          {
            tankType: null,
            health: 0,
            ammo: 8,
            medkits: 3,
            isReloading: false,
            canFire: true,
            isDestroyed: false,
            respawnTimer: 0,
          },
        ],
      };

      const CONTROLS = [
        {
          fwd: "KeyW",
          back: "KeyS",
          left: "KeyA",
          right: "KeyD",
          tLeft: "KeyQ",
          tRight: "KeyE",
          tUp: "KeyF",
          tDown: "KeyV",
          fire: "Space",
          reload: "KeyR",
          heal: "KeyB",
        },
        {
          fwd: "ArrowUp",
          back: "ArrowDown",
          left: "ArrowLeft",
          right: "ArrowRight",
          tLeft: "BracketLeft",
          tRight: "BracketRight",
          tUp: "Semicolon",
          tDown: "Quote",
          fire: "Enter",
          reload: "Numpad1",
          heal: "Numpad2",
        },
      ];

      const LAMBERT_MATERIAL = (color) =>
        new THREE.MeshLambertMaterial({ color });

      // --- Helper do tworzenia tekstury gąsienic ---
      function createTrackTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 32;
        canvas.height = 128;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#3a3a3a";
        ctx.fillRect(0, 0, 32, 128);
        ctx.fillStyle = "#2a2a2a";
        for (let i = 0; i < 128; i += 8) {
          ctx.fillRect(0, i, 32, 4);
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }
      const trackMaterial = new THREE.MeshLambertMaterial({
        map: createTrackTexture(),
      });

      // --- FUNKCJE TWORZENIA CZOŁGÓW ---
      function createStandardTank(color) {
        const tank = new THREE.Group();
        const hullGroup = new THREE.Group();
        const turretGroup = new THREE.Group();
        const hullMaterial = LAMBERT_MATERIAL(color);
        const hullWidth = 5.5,
          hullHeight = 1.8,
          hullLength = 9.0;
        const mainHull = new THREE.Mesh(
          new THREE.BoxGeometry(hullWidth, hullHeight, hullLength - 2),
          hullMaterial
        );
        mainHull.position.y = hullHeight / 2;
        hullGroup.add(mainHull);
        const glacis = new THREE.Mesh(
          new THREE.BoxGeometry(hullWidth, hullHeight * 1.2, 2.5),
          hullMaterial
        );
        glacis.position.set(0, hullHeight / 2 - 0.2, -hullLength / 2 + 0.5);
        glacis.rotation.x = -Math.PI / 6;
        hullGroup.add(glacis);
        const trackWidth = 1.2,
          trackHeight = 2.4,
          trackLength = hullLength + 1;
        const trackGroup = new THREE.Group();
        const leftTrack = new THREE.Mesh(
          new THREE.BoxGeometry(trackWidth, trackHeight, trackLength),
          trackMaterial
        );
        const rightTrack = leftTrack.clone();
        leftTrack.position.x = -hullWidth / 2 - trackWidth / 2;
        rightTrack.position.x = hullWidth / 2 + trackWidth / 2;
        trackGroup.add(leftTrack, rightTrack);
        tank.tracks = [leftTrack, rightTrack];
        const wheelGeom = new THREE.CylinderGeometry(
          0.8,
          0.8,
          trackWidth + 0.2,
          16
        );
        wheelGeom.rotateZ(Math.PI / 2);
        const wheelMaterial = new THREE.MeshLambertMaterial({
          color: 0x222222,
        });
        tank.wheels = [];
        for (let i = 0; i < 2; i++) {
          for (let j = 0; j < 5; j++) {
            const wheel = new THREE.Mesh(wheelGeom, wheelMaterial);
            wheel.position.set(
              i === 0
                ? -hullWidth / 2 - trackWidth / 2
                : hullWidth / 2 + trackWidth / 2,
              -0.2,
              -hullLength / 2 + 1 + j * 1.8
            );
            trackGroup.add(wheel);
            tank.wheels.push(wheel);
          }
        }
        trackGroup.position.y = trackHeight / 2 - 0.5;
        hullGroup.add(trackGroup);
        tank.add(hullGroup);
        const turretPoints = [
          new THREE.Vector3(2, 0, 2),
          new THREE.Vector3(2, 0, -2.5),
          new THREE.Vector3(-2, 0, -2.5),
          new THREE.Vector3(-2, 0, 2),
          new THREE.Vector3(1.5, 2, 1.5),
          new THREE.Vector3(1.5, 2, -2),
          new THREE.Vector3(-1.5, 2, -2),
          new THREE.Vector3(-1.5, 2, 1.5),
        ];
        const turretGeometry = new ConvexGeometry(turretPoints);
        turretGroup.add(
          new THREE.Mesh(
            turretGeometry,
            LAMBERT_MATERIAL(color.clone().offsetHSL(0, 0, 0.1))
          )
        );
        const mantlet = new THREE.Group();
        mantlet.add(
          new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 1.5, 1),
            LAMBERT_MATERIAL(0x444444)
          )
        );
        mantlet.position.set(0, 0.8, -2.5);
        turretGroup.add(mantlet);
        const barrel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.3, 0.2, 6, 12),
          LAMBERT_MATERIAL(0x333333)
        );
        barrel.rotation.x = Math.PI / 2;
        barrel.position.z = 3;
        mantlet.add(barrel);
        turretGroup.position.y = hullHeight + 0.1;
        turretGroup.position.z = 1;
        tank.add(turretGroup);
        tank.hullGroup = hullGroup;
        tank.turret = turretGroup;
        tank.mantlet = mantlet;
        tank.barrel = barrel;
        tank.position.y = 1.25;
        tank.userData.isTank = true;
        return tank;
      }
      function createPL01Tank(color) {
        const tank = new THREE.Group();
        const hullGroup = new THREE.Group();
        const turretGroup = new THREE.Group();
        const hullMaterial = LAMBERT_MATERIAL(color);
        const hullWidth = 6.0,
          hullHeight = 1.5,
          hullLength = 9.5;
        const mainHull = new THREE.Mesh(
          new THREE.BoxGeometry(hullWidth * 0.8, hullHeight, hullLength),
          hullMaterial
        );
        mainHull.position.y = hullHeight / 2;
        hullGroup.add(mainHull);
        const sidePanelGeom = new THREE.BoxGeometry(
          0.5,
          hullHeight * 1.5,
          hullLength
        );
        const leftPanel = new THREE.Mesh(sidePanelGeom, hullMaterial);
        leftPanel.position.set(-hullWidth / 2, hullHeight / 2, 0);
        leftPanel.rotation.z = 0.5;
        hullGroup.add(leftPanel);
        const rightPanel = new THREE.Mesh(sidePanelGeom, hullMaterial);
        rightPanel.position.set(hullWidth / 2, hullHeight / 2, 0);
        rightPanel.rotation.z = -0.5;
        hullGroup.add(rightPanel);
        tank.add(hullGroup);
        const trackWidth = 1.0,
          trackHeight = 1.8,
          trackLength = hullLength + 1;
        const trackGroup = new THREE.Group();
        const leftTrack = new THREE.Mesh(
          new THREE.BoxGeometry(trackWidth, trackHeight, trackLength),
          trackMaterial
        );
        leftTrack.position.x = -hullWidth / 2 + 0.5;
        const rightTrack = leftTrack.clone();
        rightTrack.position.x = hullWidth / 2 - 0.5;
        trackGroup.add(leftTrack, rightTrack);
        tank.tracks = [leftTrack, rightTrack];
        const wheelGeom = new THREE.CylinderGeometry(0.7, 0.7, trackWidth, 12);
        wheelGeom.rotateZ(Math.PI / 2);
        const wheelMaterial = new THREE.MeshLambertMaterial({
          color: 0x1a1a1a,
        });
        tank.wheels = [];
        for (let i = 0; i < 2; i++) {
          for (let j = 0; j < 6; j++) {
            const wheel = new THREE.Mesh(wheelGeom, wheelMaterial);
            wheel.position.set(
              i === 0 ? -hullWidth / 2 + 0.5 : hullWidth / 2 - 0.5,
              -0.2,
              -hullLength / 2 + 1 + j * 1.5
            );
            trackGroup.add(wheel);
            tank.wheels.push(wheel);
          }
        }
        trackGroup.position.y = trackHeight / 2 - 0.5;
        hullGroup.add(trackGroup);
        const turretPoints = [
          new THREE.Vector3(2.5, 0, 3),
          new THREE.Vector3(2.5, 0, -3),
          new THREE.Vector3(-2.5, 0, -3),
          new THREE.Vector3(-2.5, 0, 3),
          new THREE.Vector3(0, 1.8, 2.5),
          new THREE.Vector3(0, 1.8, -2.5),
        ];
        const turretGeometry = new ConvexGeometry(turretPoints);
        turretGroup.add(
          new THREE.Mesh(
            turretGeometry,
            LAMBERT_MATERIAL(color.clone().offsetHSL(0, 0, 0.1))
          )
        );
        const mantlet = new THREE.Group();
        mantlet.add(
          new THREE.Mesh(
            new THREE.BoxGeometry(3, 1.2, 1.5),
            LAMBERT_MATERIAL(0x444444)
          )
        );
        mantlet.position.set(0, 0.6, -2.8);
        turretGroup.add(mantlet);
        const barrel = new THREE.Mesh(
          new THREE.BoxGeometry(0.5, 0.5, 7),
          LAMBERT_MATERIAL(0x333333)
        );
        barrel.position.z = 3.5;
        mantlet.add(barrel);
        turretGroup.position.y = hullHeight;
        tank.add(turretGroup);
        tank.hullGroup = hullGroup;
        tank.turret = turretGroup;
        tank.mantlet = mantlet;
        tank.barrel = barrel;
        tank.position.y = 1.0;
        tank.userData.isTank = true;
        return tank;
      }
      function createAbramsTank(color) {
        const tank = new THREE.Group();
        const hullGroup = new THREE.Group();
        const turretGroup = new THREE.Group();
        const hullMaterial = LAMBERT_MATERIAL(color);
        const hullWidth = 6.5,
          hullHeight = 2.0,
          hullLength = 10.0;
        const mainHull = new THREE.Mesh(
          new THREE.BoxGeometry(hullWidth * 0.7, hullHeight, hullLength),
          hullMaterial
        );
        mainHull.position.y = hullHeight / 2;
        hullGroup.add(mainHull);
        const sideSkirtGeom = new THREE.BoxGeometry(
          0.2,
          hullHeight * 0.8,
          hullLength * 0.7
        );
        const leftSkirt = new THREE.Mesh(sideSkirtGeom, hullMaterial);
        leftSkirt.position.set(-hullWidth / 2 + 0.1, hullHeight / 2, 0);
        hullGroup.add(leftSkirt);
        const rightSkirt = new THREE.Mesh(sideSkirtGeom, hullMaterial);
        rightSkirt.position.set(hullWidth / 2 - 0.1, hullHeight / 2, 0);
        hullGroup.add(rightSkirt);
        tank.add(hullGroup);
        const trackWidth = 1.4,
          trackHeight = 2.0,
          trackLength = hullLength;
        const trackGroup = new THREE.Group();
        const leftTrack = new THREE.Mesh(
          new THREE.BoxGeometry(trackWidth, trackHeight, trackLength),
          trackMaterial
        );
        leftTrack.position.x = -hullWidth / 2 + 0.8;
        const rightTrack = leftTrack.clone();
        rightTrack.position.x = hullWidth / 2 - 0.8;
        trackGroup.add(leftTrack, rightTrack);
        tank.tracks = [leftTrack, rightTrack];
        const wheelGeom = new THREE.CylinderGeometry(0.8, 0.8, 0.4, 16);
        wheelGeom.rotateZ(Math.PI / 2);
        const wheelMaterial = new THREE.MeshLambertMaterial({
          color: 0x222222,
        });
        tank.wheels = [];
        for (let i = 0; i < 2; i++) {
          for (let j = 0; j < 7; j++) {
            const wheel = new THREE.Mesh(wheelGeom, wheelMaterial);
            wheel.position.set(
              i === 0 ? -hullWidth / 2 + 0.8 : hullWidth / 2 - 0.8,
              0,
              -hullLength / 2 + 1 + j * 1.2
            );
            trackGroup.add(wheel);
            tank.wheels.push(wheel);
          }
        }
        trackGroup.position.y = trackHeight / 2 - 0.6;
        hullGroup.add(trackGroup);
        const turretBase = new THREE.Mesh(
          new THREE.CylinderGeometry(2.8, 3.2, 1.0, 8),
          LAMBERT_MATERIAL(color.clone().offsetHSL(0, 0, 0.1))
        );
        turretGroup.add(turretBase);
        const turretTop = new THREE.Mesh(
          new THREE.BoxGeometry(4.5, 1.2, 6.0),
          LAMBERT_MATERIAL(color.clone().offsetHSL(0, 0, 0.1))
        );
        turretTop.position.y = 1.1;
        turretGroup.add(turretTop);
        const mantlet = new THREE.Group();
        mantlet.add(
          new THREE.Mesh(
            new THREE.BoxGeometry(2, 1.5, 1.5),
            LAMBERT_MATERIAL(0x444444)
          )
        );
        mantlet.position.set(0, 0.5, -3.0);
        turretGroup.add(mantlet);
        const barrel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.35, 0.25, 8, 12),
          LAMBERT_MATERIAL(0x333333)
        );
        barrel.rotation.x = Math.PI / 2;
        barrel.position.z = 4;
        mantlet.add(barrel);
        turretGroup.position.y = hullHeight;
        tank.add(turretGroup);
        tank.hullGroup = hullGroup;
        tank.turret = turretGroup;
        tank.mantlet = mantlet;
        tank.barrel = barrel;
        tank.position.y = 1.3;
        tank.userData.isTank = true;
        return tank;
      }

      function initializeUI() {
        document
          .getElementById("intro-logo")
          .addEventListener("animationend", () => {
            document.getElementById("intro-screen").style.display = "none";
            document.getElementById("start-screen").style.display = "flex";
            initSelectionScreenRenderers();
            animateSelectionScreen();
          });
        Object.keys(TANKS_DATA).forEach((tankKey) => {
          const tank = TANKS_DATA[tankKey];
          document.getElementById(`bar-${tankKey}-hp`).style.width = `${
            (tank.stats.hp / 150) * 100
          }%`;
          document.getElementById(`bar-${tankKey}-dmg`).style.width = `${
            (tank.stats.damage / 40) * 100
          }%`;
          document.getElementById(`bar-${tankKey}-spd`).style.width = `${
            (tank.stats.speed / 20) * 100
          }%`;
          document.getElementById(`bar-${tankKey}-rot`).style.width = `${
            (tank.stats.turretRot / 2) * 100
          }%`;
        });
        document.querySelectorAll(".select-button").forEach((button) => {
          button.addEventListener("click", (e) => {
            if (gameState.selectionComplete) return;
            const card = e.target.closest(".tank-card");
            const tankType = card.id.split("-")[1];
            if (gameState.turn === 1) {
              gameState.players[0].tankType = tankType;
              document.getElementById("selection-title").innerText =
                "Gracz 2 Wybiera Czołg";
              gameState.turn = 2;
            } else {
              gameState.players[1].tankType = tankType;
              gameState.selectionComplete = true;
              document.getElementById("start-screen").style.display = "none";
              selectionRenderers = []; // Zatrzymaj renderowanie miniaturek
              initGame();
            }
          });
        });
      }

      function initSelectionScreenRenderers() {
        Object.keys(TANKS_DATA).forEach((tankKey) => {
          const canvas = document.getElementById(`canvas-${tankKey}`);
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(
            75,
            canvas.clientWidth / canvas.clientHeight,
            0.1,
            1000
          );
          const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            alpha: true,
            antialias: true,
          });
          renderer.setSize(canvas.clientWidth, canvas.clientHeight);

          scene.add(new THREE.AmbientLight(0xffffff, 1.2));
          const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
          dirLight.position.set(5, 10, 7);
          scene.add(dirLight);

          const tankMesh = TANKS_DATA[tankKey].create(
            new THREE.Color(0xaaaaaa)
          );
          tankMesh.scale.set(0.2, 0.2, 0.2);
          tankMesh.position.y = -1.5;
          scene.add(tankMesh);
          camera.position.z = 5;

          selectionRenderers.push({ scene, camera, renderer, tankMesh });
        });
      }

      function animateSelectionScreen() {
        if (gameState.selectionComplete) return;
        requestAnimationFrame(animateSelectionScreen);
        selectionRenderers.forEach((item) => {
          item.tankMesh.rotation.y += 0.01;
          item.renderer.render(item.scene, item.camera);
        });
      }

      function initGame() {
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setScissorTest(true);
        document.body.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 200, 450);

        camera1 = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / 2 / window.innerHeight,
          0.1,
          1000
        );
        camera2 = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / 2 / window.innerHeight,
          0.1,
          1000
        );
        clock = new THREE.Clock();

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(100, 80, 50);
        scene.add(dirLight);

        player1Tank = TANKS_DATA[gameState.players[0].tankType].create(
          new THREE.Color(0x38a849)
        );
        player1Tank.position.set(-20, player1Tank.position.y, 0);
        player1Tank.userData.playerIndex = 0;
        scene.add(player1Tank);

        player2Tank = TANKS_DATA[gameState.players[1].tankType].create(
          new THREE.Color(0x35a8d4)
        );
        player2Tank.position.set(20, player2Tank.position.y, 0);
        player2Tank.rotation.y = Math.PI;
        player2Tank.userData.playerIndex = 1;
        scene.add(player2Tank);

        for (let i = 0; i < 2; i++) {
          const playerState = gameState.players[i];
          playerState.health = TANKS_DATA[playerState.tankType].stats.hp;
        }

        gameState.gameStarted = true;
        document.getElementById(
          "hud-left"
        ).innerHTML = `<div class="hud-line"><strong>GRACZ 1</strong><span>HP: <span id="hp-value-1"></span></span></div><div class="hud-bar"><div id="hp-bar-1" class="hud-bar-fill"></div></div><div class="hud-line" style="margin-top: 10px;"><span>Amunicja:</span><span id="ammo-value-1"></span></div><div class="hud-line"><span>Apteczki:</span><span id="medkits-value-1"></span></div>`;
        document.getElementById(
          "hud-right"
        ).innerHTML = `<div class="hud-line"><strong>GRACZ 2</strong><span>HP: <span id="hp-value-2"></span></span></div><div class="hud-bar"><div id="hp-bar-2" class="hud-bar-fill"></div></div><div class="hud-line" style="margin-top: 10px;"><span>Amunicja:</span><span id="ammo-value-2"></span></div><div class="hud-line"><span>Apteczki:</span><span id="medkits-value-2"></span></div>`;
        updateHUD();

        setupEventListeners();
        createScenery();
        animate();
      }

      function setupEventListeners() {
        document.addEventListener("keydown", (e) => {
          keys[e.code] = true;
        });
        document.addEventListener("keyup", (e) => {
          keys[e.code] = false;
          if (!gameState.gameStarted) return;
          for (let i = 0; i < 2; i++) {
            if (e.code === CONTROLS[i].reload) startReload(i);
            if (e.code === CONTROLS[i].heal) healPlayer(i);
          }
        });

        const menuEl = document.getElementById("menu"),
          mapEl = document.getElementById("map-overlay"),
          scoreEl = document.getElementById("score-overlay"),
          scoreDisplay = document.getElementById("score-display");
        const updatePauseState = () => {
          gameState.paused =
            menuEl.style.display === "flex" ||
            mapEl.style.display === "flex" ||
            scoreEl.style.display === "flex";
        };

        document.addEventListener("keydown", (e) => {
          if (!gameState.gameStarted) return;
          if (e.code === "Escape") {
            menuEl.style.display =
              menuEl.style.display === "flex" ? "none" : "flex";
          } else if (e.code === "KeyM") {
            mapEl.style.display =
              mapEl.style.display === "flex" ? "none" : "flex";
            if (mapEl.style.display === "flex") drawMap();
          } else if (e.code === "Tab") {
            e.preventDefault();
            const isVisible = scoreEl.style.display === "flex";
            scoreEl.style.display = isVisible ? "none" : "flex";
            if (!isVisible)
              scoreDisplay.innerText = `Gracz 1: ${gameState.scores.player1}   -   Gracz 2: ${gameState.scores.player2}`;
          }
          updatePauseState();
        });
      }

      function createScenery() {
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE),
          new THREE.MeshLambertMaterial({ map: createGroundTexture() })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);
      }

      // Przywrócone funkcje
      function createGroundTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#3c581a";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 8000; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 256;
          ctx.fillStyle = Math.random() > 0.7 ? "#6B8E23" : "#556B2F";
          ctx.fillRect(x, y, 2, 2);
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(32, 32);
        return texture;
      }

      function respawnPlayer(playerIndex) {
        const playerState = gameState.players[playerIndex];
        const tank = playerIndex === 0 ? player1Tank : player2Tank;
        const startPosition =
          playerIndex === 0
            ? new THREE.Vector3(-20, tank.position.y, 0)
            : new THREE.Vector3(20, tank.position.y, 0);

        playerState.health = TANKS_DATA[playerState.tankType].stats.hp;
        playerState.ammo = 8;
        playerState.isDestroyed = false;

        tank.position.copy(startPosition);
        tank.rotation.set(0, playerIndex === 0 ? 0 : Math.PI, 0);
        tank.turret.rotation.set(0, 0, 0);
        tank.mantlet.rotation.set(0, 0, 0);
        tank.visible = true;
      }
      function updateHUD() {
        if (!gameState.gameStarted) return;
        for (let i = 0; i < 2; i++) {
          if (!gameState.players[i].tankType) continue; // Pomiń jeśli czołg nie został jeszcze wybrany
          const playerState = gameState.players[i];
          const maxHealth = TANKS_DATA[playerState.tankType].stats.hp;
          const hpVal = document.getElementById(`hp-value-${i + 1}`);
          const hpBar = document.getElementById(`hp-bar-${i + 1}`);
          const ammo = document.getElementById(`ammo-value-${i + 1}`);
          const med = document.getElementById(`medkits-value-${i + 1}`);
          if (!hpVal) continue;

          hpVal.innerText = `${Math.max(
            0,
            playerState.health.toFixed(0)
          )} / ${maxHealth}`;
          const hpPercent = (Math.max(0, playerState.health) / maxHealth) * 100;
          hpBar.style.width = `${hpPercent}%`;
          hpBar.className = `hud-bar-fill ${hpPercent < 30 ? "low" : ""}`;
          ammo.innerText = `${playerState.ammo} / 8`;
          med.innerText = playerState.medkits;
        }
      }
      function drawMap() {
        /* ... taki sam jak poprzednio ... */
      }

      function animate() {
        requestAnimationFrame(animate);
        if (!gameState.gameStarted) return;
        const delta = clock.getDelta();
        if (!gameState.paused) {
          handleControls(delta);
          updateProjectiles(delta);
          // Inne funkcje update
        }
        updateHUD();
        if (document.getElementById("map-overlay").style.display === "flex")
          drawMap();

        renderer.setViewport(0, 0, window.innerWidth / 2, window.innerHeight);
        renderer.setScissor(0, 0, window.innerWidth / 2, window.innerHeight);
        renderer.render(scene, camera1);

        renderer.setViewport(
          window.innerWidth / 2,
          0,
          window.innerWidth / 2,
          window.innerHeight
        );
        renderer.setScissor(
          window.innerWidth / 2,
          0,
          window.innerWidth / 2,
          window.innerHeight
        );
        renderer.render(scene, camera2);
      }

      // START APLIKACJI
      initializeUI();
    </script>
